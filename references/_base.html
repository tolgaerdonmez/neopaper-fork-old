<!DOCTYPE html>
<html lang="COURSE_LANG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COURSE_TITLE</title>

  <!-- Google Fonts: Bricolage Grotesque · DM Sans · JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX, bundled locally in vendor/katex (no CDN). main.js renders all math. -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>

  <link rel="stylesheet" href="styles.css">

  <!--
    CUSTOMIZE PER COURSE — change only the three accent variables below.
    Options:
      vermillion  #D94F30 / #C4432A / #FDEEE9 / #E8836C  (default)
      coral       #E06B56 / #C85A47 / #FDECEA / #E89585
      teal        #2A7B9B / #1F6280 / #E4F2F7 / #5A9DB8
      amber       #D4A843 / #BF9530 / #FDF5E0 / #E0C070
      forest      #2D8B55 / #226B41 / #E8F5EE / #5AAD7A
  -->
  <style>
    :root {
      --color-accent:       ACCENT_COLOR;
      --color-accent-hover: ACCENT_HOVER;
      --color-accent-light: ACCENT_LIGHT;
      --color-accent-muted: ACCENT_MUTED;
    }
  </style>

  <!--
    UI STRINGS. Replace COURSE_UI_STRINGS with {} for an English course. For any
    other output language, put a JSON object translating the keys, for example:
    {"pickAnswer": "...", "correct": "...", "notQuite": "...", "step": "... {n} / {total}",
     "explorerBack": "...", "explorerReset": "...", "explorerHistory": "...",
     "explorerChecks": "...", "explorerNoSteps": "...", "explorerHolds": "...",
     "explorerFails": "...", "explorerStart": "...", "dropHere": "...",
     "found": "...", "notThisLine": "...", "flowStart": "..."}
    Keys and English defaults live at the top of main.js.
  -->
  <script type="application/json" id="course-ui">COURSE_UI_STRINGS</script>

  <script src="main.js" defer></script>
</head>
<body>

  <nav class="nav" id="nav">
    <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="nav-inner">
      <span class="nav-title">COURSE_TITLE</span>
      <div class="nav-dots" id="nav-dots" role="tablist">
        NAV_DOTS
      </div>
    </div>
  </nav>

  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div class="sidebar-header">
      <span class="sidebar-title">COURSE_TITLE</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      SIDEBAR_ITEMS
    </nav>
  </aside>

  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span class="sidebar-toggle-icon"></span>
  </button>

  <div class="page-wrapper" id="page-wrapper">
  <main id="main">
